$kind: http-request
url: "{{baseUrl}}/api/items"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: formdata
  content:
    - type: text
      key: title
      value: Test Umbrella
    - type: text
      key: type
      value: found
    - type: text
      key: category
      value: Accessories
    - type: text
      key: description
      value: Black umbrella found near library
    - type: text
      key: location
      value: Library
    - type: text
      key: itemDate
      value: 2026-11-12
order: 8000
